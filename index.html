<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UT Wirahasta</title>

  <!-- PWA & Theme Settings -->
  <meta name="theme-color" content="#0d6efd">
  <meta name="description" content="Aplikasi Resmi UT Wirahasta">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="UT Wirahasta">

  <!-- Manifest PWA -->
  <link rel="manifest" href="manifest.json">

  <!-- Favicon & Icons -->
  <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/icon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="assets/icons/icon-16x16.png">
  <link rel="apple-touch-icon" href="assets/icons/icon-192x192.png">

  <!-- CSS Stylesheets -->
  <link rel="stylesheet" href="assets/css/all.min.css">
</head>
<body>

  <!-- Konten Utama Aplikasi -->
  <main id="app">
    <header>
      <h1>Selamat Datang di UT Wirahasta</h1>
    </header>
    <section>
      <p>Aplikasi ini telah mendukung fitur PWA (Progressive Web App) dan dapat diakses secara offline.</p>
    </section>
  </main>

  <!-- Registrasi Service Worker PWA -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then((reg) => console.log('Service Worker berhasil didaftarkan:', reg.scope))
          .catch((err) => console.error('Pendaftaran Service Worker gagal:', err));
      });
    }
  </script>
</body>
</html>
